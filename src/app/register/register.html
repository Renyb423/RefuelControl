<!-- src/app/register/register.component.html -->
<div class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 font-sans">
  <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-lg w-full max-w-md border border-slate-200/80">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center mx-auto mb-3 shadow-md shadow-indigo-500/20 font-bold">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-slate-800">Crear una Cuenta</h2>
      <p class="text-xs text-slate-500 mt-1">Regístrate para llevar el control de tus repostajes</p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ errorMessage }}</span>
      </div>
    }

    @if (successMessage) {
      <div class="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-xl flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
        <span>{{ successMessage }}</span>
      </div>
    }

    <form (ngSubmit)="onRegister()" class="space-y-4">
      <div>
        <label for="email" class="block text-xs font-semibold text-slate-700 mb-1.5">Email</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          [(ngModel)]="email" 
          required 
          placeholder="tu@email.com"
          class="w-full py-2.5 px-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
      </div>
      <div>
        <label for="name" class="block text-xs font-semibold text-slate-700 mb-1.5">Nombre</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          [(ngModel)]="name" 
          required 
          placeholder="Tu Nombre"
          class="w-full py-2.5 px-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
      </div>
      <div>
        <label for="password" class="block text-xs font-semibold text-slate-700 mb-1.5">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          placeholder="••••••••"
          class="w-full py-2.5 px-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
      </div>
      <button 
        type="submit" 
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm hover:shadow-indigo-500/25 transition-all duration-200 cursor-pointer">
        Registrarse
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-slate-500">
      ¿Ya tienes cuenta? <a href="/login" class="text-indigo-600 hover:text-indigo-800 font-semibold transition-colors">Inicia sesión aquí</a>
    </p>
  </div>
</div>
