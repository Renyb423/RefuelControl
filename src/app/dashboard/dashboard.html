<div class="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col">
  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <!-- App Brand / Logo -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-600 text-white flex items-center justify-center font-black shadow-md shadow-indigo-500/20">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900 leading-none">Refuel Control</h1>
          <span class="text-[11px] font-medium text-slate-500">Gestión Inteligente de Combustible</span>
        </div>
      </div>

      <!-- Action Buttons / User Logout -->
      <div class="flex items-center gap-3">
        @if (supabaseService.currentUser()) {
          <span class="text-xs font-semibold text-slate-600 bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 hidden sm:inline-block">
            {{ supabaseService.currentUser()?.email }}
          </span>
        }

        <button 
          (click)="onLogout()" 
          class="px-3.5 py-1.5 rounded-xl border border-slate-200 text-slate-600 hover:text-rose-600 hover:border-rose-200 hover:bg-rose-50 font-semibold text-xs transition-all flex items-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
    <!-- Banner de Bienvenida con Saludo en Grande -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-gradient-to-r from-indigo-500/10 via-purple-500/5 to-transparent p-6 rounded-2xl border border-indigo-100/80 shadow-2xs">
      <div>
        <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
          ¡Hola, {{ getUserName() }}! 👋
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1 font-medium">
          Bienvenido a tu panel de control de combustible. Aquí tienes el resumen de tus gastos.
        </p>
      </div>
      <div class="hidden sm:flex items-center gap-2 text-xs font-semibold text-indigo-700 bg-white px-4 py-2.5 rounded-xl border border-indigo-100 shadow-xs">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>Sesión Activa</span>
      </div>
    </div>

    <!-- Componente 1: Sumatoria del Mes de Gasto -->
    <section class="w-full">
      <app-resumen-mes></app-resumen-mes>
    </section>

    <!-- Layout en 2 columnas: Ingreso de Datos (Formulario) + Historial -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- Componente 2: Ingreso de Datos -->
      <section class="lg:col-span-5">
        <app-ingreso-datos></app-ingreso-datos>
      </section>

      <!-- Componente 3: Historial -->
      <section class="lg:col-span-7">
        <app-historial></app-historial>
      </section>
    </div>
  </main>
</div>
