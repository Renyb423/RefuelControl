<div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
  <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
    <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center font-bold">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
    </div>
    <div>
      <h3 class="text-lg font-bold text-slate-800">Ingreso de Repostaje</h3>
      <p class="text-xs text-slate-500">Registra un nuevo repostaje de combustible</p>
    </div>
    @if (showForm()) {
      <button
        type="button"
        (click)="toggleForm()"
        class="ml-auto py-2 px-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs rounded-xl transition-all cursor-pointer">
        Cancelar
      </button>
    } @else {
      <button
        type="button"
        (click)="toggleForm()"
        class="ml-auto py-2 px-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-xl shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span>Añadir Repostaje</span>
      </button>
    }
  </div>

  @if (successMessage()) {
    <div class="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-xl flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
      <span>{{ successMessage() }}</span>
    </div>
  }

  @if (showForm()) {
    @if (errorMessage()) {
      <div class="mb-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl flex items-center gap-2">
        <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Fecha -->
        <div>
          <label for="fecha" class="block text-xs font-semibold text-slate-700 mb-1.5">Fecha</label>
          <input 
            type="date" 
            id="fecha" 
            name="fecha" 
            min="2026-08-01"
            [ngModel]="fecha()" 
            (ngModelChange)="fecha.set($event)" 
            required 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
        </div>

        <!-- Tipo de Combustible -->
        <div>
          <label for="tipoCombustible" class="block text-xs font-semibold text-slate-700 mb-1.5">Tipo de Combustible</label>
          <select 
            id="tipoCombustible" 
            name="tipoCombustible" 
            [ngModel]="tipoCombustible()" 
            (ngModelChange)="tipoCombustible.set($event)" 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            <option value="Gasolina">Gasolina</option>
            <option value="Diésel">Diésel</option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Gasolinera -->
        <div>
          <label for="gasolinera" class="block text-xs font-semibold text-slate-700 mb-1.5">Gasolinera</label>
          <select 
            id="gasolinera" 
            name="gasolinera" 
            [ngModel]="gasolinera()" 
            (ngModelChange)="gasolinera.set($event)" 
            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            <option value="Costco">Costco</option>
            <option value="Farruco">Farruco</option>
            <option value="Ballenoil">Ballenoil</option>
            <option value="Galp">Galp</option>
            <option value="Repsol">Repsol</option>
            <option value="Otra">Otra</option>
          </select>
        </div>

        <!-- Precio por Litro -->
        <div>
          <label for="precioPorLitro" class="block text-xs font-semibold text-slate-700 mb-1.5">Precio por Litro (€/L)</label>
          <div class="relative">
            <input 
              type="number" 
              step="0.001" 
              min="0.1" 
              id="precioPorLitro" 
              name="precioPorLitro" 
              [ngModel]="precioPorLitro()" 
              (ngModelChange)="onPrecioChange($event)" 
              required 
              placeholder="1.599" 
              class="w-full pl-3.5 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-medium">€</span>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Litros -->
        <div>
          <label for="litros" class="block text-xs font-semibold text-slate-700 mb-1.5">Litros (L)</label>
          <div class="relative">
            <input 
              type="number" 
              step="0.01" 
              min="0.1" 
              id="litros" 
              name="litros" 
              [ngModel]="litros()" 
              (ngModelChange)="onLitrosChange($event)" 
              required 
              placeholder="40.0" 
              class="w-full pl-3.5 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            <span class="absolute right-3 top-2.5 text-xs text-slate-400 font-medium">L</span>
          </div>
        </div>

        <!-- Total de Repostaje -->
        <div>
          <label for="total" class="block text-xs font-semibold text-slate-700 mb-1.5">Total del Repostaje (€)</label>
          <div class="relative">
            <input 
              type="number" 
              step="0.01" 
              min="0.1" 
              id="total" 
              name="total" 
              [ngModel]="total()" 
              (ngModelChange)="total.set($event)" 
              required 
              placeholder="Calculado o manual" 
              class="w-full pl-3.5 pr-8 py-2.5 bg-indigo-50/40 border border-indigo-200 rounded-xl text-xs sm:text-sm font-semibold text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
            <span class="absolute right-3 top-2.5 text-xs font-bold text-indigo-600">€</span>
          </div>
        </div>
      </div>

      <button 
        type="submit" 
        class="w-full mt-2 py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs sm:text-sm rounded-xl shadow-sm hover:shadow-indigo-500/25 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span>Guardar Repostaje</span>
      </button>
    </form>
  }
</div>
